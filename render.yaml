# Render Blueprint — deploys BioStor's backend + frontend to Render (free tier).
# Docs: https://render.com/docs/blueprint-spec
#
# Before launching this blueprint you need:
#   1. A free Neon account with a PostgreSQL project  -> provides DATABASE_URL
#   2. During launch, fill in the `sync: false` env vars below (or set them
#      after the services are created).
services:
  - type: web
    name: biostor-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: biostor-frontend
    runtime: node
    rootDir: frontend
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20.19.4"
